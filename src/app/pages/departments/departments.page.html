<ion-header><ion-toolbar><ion-title>Departments</ion-title></ion-toolbar></ion-header>
<ion-content>
  <div class="page-container">
    <h1>Departments</h1>
    <ion-list inset="true">
      <ion-item *ngFor="let department of departments" [routerLink]="['/employees']" detail="true">
        <ion-label><h2>{{ department }}</h2><p>Employee directory</p></ion-label>
        <ion-badge slot="end">{{ count(department) }}</ion-badge>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
