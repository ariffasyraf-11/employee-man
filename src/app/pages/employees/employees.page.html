<ion-header>
  <ion-toolbar><ion-title>Employees</ion-title></ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <ion-searchbar [(ngModel)]="search" (ionInput)="onSearch()" placeholder="Search name, ID, position..."></ion-searchbar>
    <ion-select [(ngModel)]="departmentId" (ionChange)="onDepartmentChange()" label="Department" interface="popover">
      <ion-select-option [value]="undefined">All departments</ion-select-option>
      <ion-select-option *ngFor="let item of departments" [value]="item.id">{{ item.name }}</ion-select-option>
    </ion-select>

    <p *ngIf="error">{{ error }}</p>
    <p *ngIf="loading">Loading employees...</p>

    <ion-list inset="true" *ngIf="!loading">
      <ion-item *ngFor="let employee of employees" [routerLink]="['/employees', employee.id]" detail="true">
        <ion-label>
          <h2>{{ employee.name }}</h2>
          <p>{{ employee.employee_no }} · {{ employee.position }}</p>
          <p>{{ employee.department.name }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="employee.status ? 'success' : 'medium'">{{ employee.status ? 'Active' : 'Inactive' }}</ion-badge>
      </ion-item>
    </ion-list>

    <p *ngIf="!loading && !error && employees.length === 0">No employees found.</p>
  </div>
</ion-content>
