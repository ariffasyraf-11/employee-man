<ion-header>
  <ion-toolbar><ion-title>Employees</ion-title></ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <ion-searchbar [(ngModel)]="search" placeholder="Search name, ID, position..."></ion-searchbar>
    <ion-select [(ngModel)]="department" label="Department" interface="popover">
      <ion-select-option value="All">All departments</ion-select-option>
      <ion-select-option *ngFor="let item of departments" [value]="item">{{ item }}</ion-select-option>
    </ion-select>

    <ion-list inset="true">
      <ion-item *ngFor="let employee of filteredEmployees" [routerLink]="['/employees', employee.id]" detail="true">
        <ion-label>
          <h2>{{ employee.name }}</h2>
          <p>{{ employee.employeeId }} · {{ employee.position }}</p>
          <p>{{ employee.department }} · {{ employee.unit }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="employee.status === 'Active' ? 'success' : 'medium'">{{ employee.status }}</ion-badge>
      </ion-item>
    </ion-list>

    <p *ngIf="filteredEmployees.length === 0">No employees found.</p>
  </div>
</ion-content>
